" /></g><g font-size="21" font-weight="700" text-anchor="middle"><text x="134" y="468" style="font-family:Arial, sans-serif;font-size:21px;font-weight:700;letter-spacing:normal">LLM response</text><text x="360" y="468" style="font-family:Arial, sans-serif;font-size:21px;font-weight:700;letter-spacing:normal">Fact-check</text><text x="586" y="455" style="font-family:Arial, sans-serif;font-size:21px;font-weight:700;letter-spacing:normal">Human</text><text x="586" y="484" style="font-family:Arial, sans-serif;font-size:21px;font-weight:700;letter-spacing:normal">decision</text></g><path d="M228 462H258M454 462H484" stroke="#d6ef9d" stroke-width="2" marker-end="url(#arrow)" class="illustration-motion process-flow" stroke-dasharray="5 4" /><text x="40" y="552" font-size="16" fill="#c6d6c0" style="font-family:Arial, sans-serif;font-size:16px;font-weight:400;letter-spacing:normal">Illustrative oversight process · Research-writing theme</text><path d="M268 159H452" stroke="#d6ef9d" stroke-opacity=".25" stroke-width="11" stroke-linecap="round" class="illustration-motion ai-scan" /><circle cx="361" cy="300" r="55" fill="none" stroke="#d6ef9d" stroke-width="2" opacity=".3" class="illustration-motion verification-halo" /></g></svg>